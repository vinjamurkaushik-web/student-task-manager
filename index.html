<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <header>
      <h1>Student Task Manager</h1>
      <p class="subtitle">Stay on top of your college tasks</p>
    </header>

    <!-- Task Input Section -->
    <section class="input-section">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task..."
        maxlength="100"
      />
      <select id="categoryInput" aria-label="Task category">
        <option value="College">College</option>
        <option value="Personal">Personal</option>
        <option value="Work">Work</option>
        <option value="Other" selected>Other</option>
      </select>
      <button id="addTaskBtn" onclick="addTask()">Add Task</button>
    </section>

    <!-- Task Statistics Section -->
    <section class="stats-section">
      <h2>Task Statistics</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Total Tasks</span>
          <strong id="totalTasks">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Completed Tasks</span>
          <strong id="completedTasks">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Pending Tasks</span>
          <strong id="pendingTasks">0</strong>
        </div>
      </div>
    </section>

    <!-- Task List Section -->
    <section class="task-section">
      <h2>My Tasks</h2>
      <ul id="taskList">
        <!-- Tasks are inserted here by script.js -->
      </ul>
      <p id="emptyMessage" class="empty-message">No tasks yet. Add one above!</p>
    </section>

  </div>

  <footer>
    <p>DevOps Lab Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
